<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIGFIT RTX - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="Logo">
            <img src="../Assets/Icono.png" alt="icono RTX" class="Logo-icon">
            <div class ="Logo-texto">
                <h1>
                    <span class="RIGFIT">RIGFIT</span>
                    <span class="RTX">RTX</span>
                </h1>
                <h2>HARWARE TELEMETRY CORE</h2>
            </div>
        </div>

        <div class="Profile">
            <button class="Profile-btn"> LOGIN </button>
            <img src="../Assets/Perfil.png" alt="foto de perfil" class="Profile-icon">
        </div>
    </header>
    
    <main>
        <div class="Caja">
            <div class="Intro">
                <p class="ssl"> PROTOCOLO SSL // 2048-BIT</p>
                <h3>INICIO DE SESIÓN RIGFIT RTX</h3>
                <p class="descripcion">Analizador de componentes de dispositivos (computadora o celular) para calcular su uso</p>
            </div>
            <form>
                <label for="Usuario" class="Correo-Nombre"> INICIAR CON CORREO O NOMBRE DE USUARIO</label><br>
                <input type="text" id="Usuario" name="Usuario" class="correo-input" placeholder="Ej. j.seson@gmail.com o J_Aseson"><br><br>

                <label for="Password" class="contraseña"> CONTRASEÑA</label><br>
                <input type="Password" id="Password" name="Password" class="contraseña-input" placeholder="*********"><br><br>
                <button type="Button"> CREAR CUENTA NUEVA</button><br><br>

                <p>¿YA TIENES CUENTA RTX?</p>
                <button type="Button"> INICIAR SESIÓN</button><br><br>

                <p>ACCESO SIN VINCULACIÓN</p>
                <button type="Button">CONTINUAR COMO INVITADO</button>
            </form>
        </div>
    </main>
    <footer>
        <p>Ucompensar</p>
    </footer>
</body>
</html>
